<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0a2342">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Tournament Check-In | Spokane County USBC</title>
  <style>
  /* Sticky navy header with the counts and search; below it the lane-sheet photo strip, then one card per team. */
  :root{
    --navy:#0a2342; --gold:#e8b84b;
    --bg:#eef1f5; --surface:#ffffff; --surface-2:#f5f7fa; --line:#d5dbe3;
    --fg:#16202c; --muted:#5a6878; --accent:#1a3a6e; --accent-ink:#ffffff;
    --ok:#1d7a46; --ok-bg:#e2f3e9; --warn:#995a00; --warn-bg:#fdf0d6;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){:root{
    --bg:#0e141c; --surface:#17202b; --surface-2:#1d2834; --line:#2b3746;
    --fg:#e5eaf0; --muted:#93a1b0; --accent:#8db6ec; --accent-ink:#0c1520;
    --ok:#5fd393; --ok-bg:#153424; --warn:#f2b552; --warn-bg:#382a0e; color-scheme:dark}}
  *{box-sizing:border-box;margin:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4}
  .wrap{max-width:980px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top);box-shadow:0 2px 8px rgba(0,0,0,.2)}
  header .wrap{padding-block:10px;display:grid;gap:9px}
  .brand{font-size:.78rem;font-weight:600;opacity:.85}
  .brand span{color:var(--gold)}
  .title{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
  h1{font-size:1.35rem;line-height:1.15;text-wrap:balance}
  .when{color:var(--gold);font-size:.88rem}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:5px 9px;min-width:0}
  .stat b{display:block;font-size:1.25rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
  .stat span{font-size:.68rem;opacity:.8;text-transform:uppercase;letter-spacing:.06em}
  .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin-top:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
  .controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .search{flex:1 1 220px;min-width:0;font:inherit;font-size:16px;padding:8px 11px;border-radius:8px;border:0;background:#fff;color:#16202c}
  .seg{display:inline-flex;border:1px solid rgba(255,255,255,.3);border-radius:8px;overflow:hidden}
  .seg button{font:inherit;font-size:.82rem;border:0;background:transparent;color:#fff;padding:7px 10px;cursor:pointer}
  .seg button+button{border-left:1px solid rgba(255,255,255,.3)}
  .seg button[aria-pressed="true"]{background:var(--gold);color:var(--navy);font-weight:600}
  .status{font-size:.78rem;opacity:.85;min-height:1em}
  .status.err{color:var(--gold);opacity:1;font-weight:600}
  button:focus-visible,input:focus-visible,label.btn:focus-within{outline:2px solid var(--gold);outline-offset:2px}

  main .wrap{padding-block:14px 48px;display:grid;gap:14px}
  .photos{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:10px}
  .photos-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
  .photos h2{font-size:1.05rem}
  .note{color:var(--muted);font-size:.88rem}
  .thumbs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
  .thumbs:empty{display:none}
  .thumb{position:relative;flex:0 0 auto}
  .thumb .open{border:1px solid var(--line);border-radius:8px;padding:0;background:var(--surface-2);cursor:zoom-in;display:block;overflow:hidden}
  .thumb img{display:block;height:150px;width:auto}
  .thumb .rm{position:absolute;top:6px;right:6px;font:inherit;font-size:.75rem;border:0;border-radius:6px;padding:3px 7px;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
  .btn{font:inherit;font-size:.88rem;font-weight:600;border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 12px;cursor:pointer;display:inline-block}
  .btn input{position:absolute;width:1px;height:1px;opacity:0}

  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:12px}
  .team{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
  .team.ready{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
  .team-head{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
  .team-name{flex:1;min-width:0}
  .team-name strong{display:block;font-size:1.02rem;line-height:1.2;overflow-wrap:anywhere}
  .team-name small{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
  .lane{display:flex;flex-direction:column;align-items:center;gap:1px}
  .lane label{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .lane input{width:3.4em;text-align:center;font:inherit;font-size:1.2rem;font-weight:700;padding:2px 4px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
  .bowler{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 12px}
  .bowler+.bowler{border-top:1px solid var(--line)}
  .ci{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;color:transparent;font-size:1.3rem;font-weight:700;padding:0}
  .ci[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
  .who{min-width:0}
  .nm{font-weight:600;font-size:1rem;overflow-wrap:anywhere}
  .meta{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:2px 10px}
  .meta .t{color:var(--ok);font-weight:600}
  .also{font-size:.75rem;color:var(--accent)}
  .pill{font:inherit;font-size:.75rem;font-weight:700;border-radius:999px;padding:5px 11px;border:1px solid transparent;cursor:pointer;white-space:nowrap}
  .pill.paid{background:var(--ok-bg);color:var(--ok)}
  .pill.due{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
  .empty{color:var(--muted);text-align:center;padding:32px 0}
  .flat .team-head{display:none}

  .lightbox{position:fixed;inset:0;z-index:20;background:rgba(4,8,12,.94);display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .lightbox[hidden]{display:none}
  .lb-bar{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px}
  .lb-bar button{font:inherit;border:0;border-radius:8px;padding:8px 14px;background:#2a3542;color:#fff;cursor:pointer}
  .lb-img{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center}
  .lb-img img{max-width:100%;height:auto}
  .lightbox.zoom .lb-img img{max-width:none;width:220%}
  @media (max-width:560px){h1{font-size:1.15rem} .stats{gap:4px} .stat{padding:4px 6px} .stat b{font-size:1.02rem} .stat span{font-size:.56rem;letter-spacing:.03em;display:block;line-height:1.2} .brand{display:none} .seg button{padding:6px 9px}}
  @media (prefers-reduced-motion:reduce){.bar i{transition:none}}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">🎳 <span>Spokane County</span> USBC · Check-in desk</div>
    <div class="title">
      <h1 id="ev-name">Tournament check-in</h1>
      <span class="when" id="ev-when"></span>
    </div>
    <div class="stats">
      <div class="stat"><b id="s-in">–</b><span>Checked in</span><div class="bar"><i id="s-bar"></i></div></div>
      <div class="stat"><b id="s-ready">–</b><span id="s-ready-l">Teams ready</span></div>
      <div class="stat"><b id="s-due">–</b><span>Still owe</span></div>
      <div class="stat"><b id="s-lanes">–</b><span id="s-lanes-l">Teams on lanes</span></div>
    </div>
    <div class="controls">
      <input id="q" class="search" type="search" placeholder="Search bowler, team, USBC #, or lane" autocomplete="off" aria-label="Search">
      <div class="seg" role="group" aria-label="Show">
        <button type="button" data-f="all" aria-pressed="true">All</button>
        <button type="button" data-f="out" aria-pressed="false">Not here</button>
        <button type="button" data-f="in" aria-pressed="false">Here</button>
        <button type="button" data-f="due" aria-pressed="false">Owes</button>
      </div>
      <div class="seg" role="group" aria-label="Sort">
        <button type="button" data-v="team" aria-pressed="true">Teams</button>
        <button type="button" data-v="lane" aria-pressed="false">By lane</button>
        <button type="button" data-v="name" aria-pressed="false">A–Z</button>
      </div>
    </div>
    <div id="status" class="status">Loading the roster…</div>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="photos" aria-labelledby="ph-h">
      <div class="photos-head">
        <h2 id="ph-h">Lane assignments</h2>
        <label class="btn" id="ph-btn">Add photo<input id="ph-file" type="file" accept="image/*"></label>
      </div>
      <p id="ph-note" class="note">No lane sheet yet. Take a photo of the posted lane sheet and add it here; tap it later to see it full size.</p>
      <div id="thumbs" class="thumbs"></div>
    </section>
    <div id="list" class="list" aria-live="polite"></div>
  </div>
</main>

<div id="lb" class="lightbox" hidden>
  <div class="lb-bar"><button type="button" id="lb-zoom">Zoom</button><button type="button" id="lb-close">Close</button></div>
  <div class="lb-img"><img id="lb-img" alt="Lane assignment sheet"></div>
</div>
<noscript><p class="empty">This page needs JavaScript turned on.</p></noscript>
<script src="checkin-page.js"></script>
</body>
</html>
